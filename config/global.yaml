llm:
  provider: openai
  model: deepseek-chat
  answer_model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  temperature: 0.2
  thinking_budget: 0
categorization:
  confidence_thresholds:
    categorization_low_confidence: 0.5
  industry_keywords:
    automotive:
    - toyota
    - ford
    - bmw
    - vehicle
    - engine
    - torque
    - transmission
    - chassis
    - automotive
    electronics:
    - circuit
    - pcb
    - schematic
    - voltage
    - resistor
    - capacitor
    - signal
    - semiconductor
    manufacturing:
    - assembly
    - drawing
    - tolerance
    - weld
    - machining
    - fixture
    - jig
    - bom
    - part number
    finance:
    - balance sheet
    - revenue
    - profit
    - ledger
    - audit
    - fiscal
    - equity
    - financial statement
    legal:
    - contract
    - agreement
    - clause
    - liability
    - indemnity
    - arbitration
    - jurisdiction
    healthcare:
    - patient
    - diagnosis
    - clinical
    - pharma
    - dosage
    - trial
    - medical
    - drug
    - therapy
    retail_ecommerce:
    - order id
    - add to cart
    - delivery address
    - shipped
    - return policy
    - sku
    - cart total
    - mrp
    travel_transport:
    - pnr
    - boarding point
    - seat number
    - departure time
    - ticket number
    - passenger name
    - bus operator
    - coach number
    entertainment_media:
    - showtime
    - screen number
    - movie ticket
    - booking id
    - seat no
    - show timing
    - multiplex
    - cinema hall
    general: []
vision:
  provider: openai
  model: meta/llama-3.2-11b-vision-instruct
  base_url: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  enabled: true
  dpi: 150
  min_image_px: 150
  timeout_s: 120
  max_retries: 5
  max_concurrency: 3
  min_interval_s: 0.5
  prompt:
    default: 'Describe what this image shows in 2-3 sentences. Be specific about the type of visual (diagram,
      chart, photo, schematic) and capture component labels, part numbers, dimensions, and any visible
      text VERBATIM (do not paraphrase numbers).

      '
    automotive: 'You are analyzing a page from a vehicle/equipment service manual. Capture exploded views
      and assembly diagrams, part names and part numbers, callout numbers, fasteners, torque/clearance
      specs, and any labels, warnings, or measurements. Be precise — this is used for parts/maintenance
      search.

      '
    cad_route: 'Describe all visible circuit components, reference designators (R1, C4), net names (e.g.
      5V_RAIL, GND), connector types, pin counts, and any visible dimensions or tolerances. Be precise
      — this is used for search.

      '
vision_ocr:
  enabled: true
  mode: always
  provider: openai
  model: meta/llama-3.2-11b-vision-instruct
  base_url: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  dpi: 150
  min_interval_s: 0.5
  max_retries: 3
  timeout_s: 120
  figure_source: docling
  grounding: false
  grounding_coords: pixel
  route_gates:
  - text_default
  - diagram_heavy
  - image_route
ocr:
  engine: paddle
  layout_engine: auto
  surya_timeout_s: 90
  subprocess_timeout_s: 1800
extraction:
  deskew: true
  stitch_tables: true
  stitch_arbitration: true
  docling:
    do_ocr: false
    do_table_structure: true
    images_scale: 2.0
    min_picture_pts: 24
    min_picture_area_frac: 0.004
    figure_union: true
    page_rescue: true
    max_vlm_pages: 60
    device: auto
    num_threads: 4
  by_kind:
    digital:
      table_source: auto
    scanned:
      table_source: auto
    mixed:
      table_source: auto
    default:
      table_source: auto
  large_format:
    enabled: true
    dpi: 200
    vlm_max_px: 2600
    overlap: 0.12
    merge: llm
    max_tiles: 24
  cad:
    max_pages: 0
embeddings:
  dense_provider: jina
  dense_model: jina-embeddings-v3
  dense_api_key: ${JINA_API_KEY}
  dense_dim: 1024
  dense_document_prefix: ''
  dense_query_prefix: ''
  dense_batch_size: 16
  sparse_model: Qdrant/bm25
  reranker_provider: jina
  reranker_model: jina-reranker-v2-base-multilingual
  reranker_api_key: ${JINA_API_KEY}
  chunking_model: minishlab/potion-base-32M
chunking:
  strategy: semantic
  size: 400
  overlap: 50
  section_aware: true
  split_large_tables: true
enrichment:
  summarize: true
  keyword_count: 6
  min_interval_s: 0.3
  batch_size: 10
  prompt: 'You label document chunks for a technical search index. For each chunk produce a one-sentence
    summary stating what it is about and what a reader would learn (in the document''s own terms), plus
    6-10 SPECIFIC search terms taken from the chunk — part numbers, model names, component/procedure names,
    specs and units, domain terms. Never use stopwords, generic words (information, section, manual),
    or terms not present in the chunk.

    '
query:
  small_corpus_tokens: 100000
  max_context_tokens: 3000
  steps:
  - query_planner
  - retrieval
  - answerer
  planner:
    max_sub_questions: 4
  answerer: null
  hyde:
    enabled: false
  retrieval:
    method: hybrid_rerank
    top_n: 20
    candidate_k: 80
    rerank_top_k: 5
    dense_weight: 0.6
    sparse_weight: 0.4
  agent:
    max_iterations: 4
    provider: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    extra_body: {}
    write_tools:
    - ingest_document
    max_history_messages: 20
document_types:
- invoice
- purchase_order
- financial_statement
- report
- research_paper
- manual
- contract
- policy
- datasheet
- presentation
- spreadsheet
- cad_drawing
- circuit_diagram
- schematic
- image
- unknown
industries:
- automotive
- electronics
- manufacturing
- finance
- legal
- healthcare
- retail_ecommerce
- travel_transport
- entertainment_media
- general
default_industry: general
type_to_route:
  cad_drawing: cad_route
  circuit_diagram: circuit_route
  schematic: diagram_heavy
  datasheet: diagram_heavy
  report: text_default
  research_paper: text_default
  manual: text_default
  invoice: text_default
  purchase_order: text_default
  financial_statement: text_default
  contract: text_default
  policy: text_default
  presentation: text_default
  spreadsheet: text_default
  image: image_route
  unknown: text_default
extractors:
  excel: excel_extraction
  ppt: ppt_extraction
  docx: word_extraction
  image: image_extraction
pdf_extractors:
  digital: docling_pdf
  scanned: docling_pdf
  mixed: docling_pdf
route_extractors:
  cad_route: cad_extract
  circuit_route: cad_extract
routes:
  text_default:
    steps:
    - categorize
    - extract
    - chunk
    - enrich_chunks
    - embed
    - index
  diagram_heavy:
    steps:
    - categorize
    - extract
    - vision_enrichment
    - chunk
    - enrich_chunks
    - embed
    - index
  cad_route:
    steps:
    - categorize
    - extract
    - chunk
    - enrich_chunks
    - embed
    - index
  circuit_route:
    steps:
    - categorize
    - extract
    - chunk
    - enrich_chunks
    - embed
    - index
  image_route:
    steps:
    - categorize
    - extract
    - vision_enrichment
    - chunk
    - enrich_chunks
    - embed
    - index
ingestion:
  steps:
  - categorize
  - extract
  - vision_enrichment
  - chunk
  - enrich_chunks
  - embed
  - index
  route_gates:
    vision_enrichment:
    - text_default
    - diagram_heavy
    - image_route
database:
  postgres_url: ${POSTGRES_URL}
  qdrant_url: ${QDRANT_URL}
  qdrant_collection: chunks
