    general: []
vision:
  provider: openai
  model: meta/llama-3.2-11b-vision-instruct
  base_url: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  enabled: true
  dpi: 150
  min_image_px: 150
  timeout_s: 120
  max_retries: 5
  max_concurrency: 2
  min_interval_s: 2
  prompt:
    default: 'Describe what this image shows in 2-3 sentences. Be specific about the
      type of visual (diagram, chart, photo, schematic) and capture component labels,
      part numbers, dimensions, and any visible text VERBATIM (do not paraphrase numbers).

      '
    automotive: 'You are analyzing a page from a vehicle/equipment service manual.
      Capture exploded views and assembly diagrams, part names and part numbers, callout
      numbers, fasteners, torque/clearance specs, and any labels, warnings, or measurements.
      Be precise — this is used for parts/maintenance search.

      '
    cad_route: 'Describe all visible circuit components, reference designators (R1,
      C4), net names (e.g. 5V_RAIL, GND), connector types, pin counts, and any visible
      dimensions or tolerances. Be precise — this is used for search.

      '
vision_ocr:
  enabled: true
  mode: always
  provider: openai
  model: meta/llama-3.2-11b-vision-instruct
  base_url: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  dpi: 150
  min_interval_s: 2
  max_retries: 3
  timeout_s: 120
ocr:
  engine: paddle
  layout_engine: auto
  surya_timeout_s: 90
  subprocess_timeout_s: 1800
extraction:
  deskew: true
  stitch_tables: true
  stitch_arbitration: true
  docling:
    do_ocr: false
    do_table_structure: true
    images_scale: 2.0
    min_picture_pts: 24
    min_picture_area_frac: 0.004
    figure_union: true
    page_rescue: true
    max_vlm_pages: 60
    device: auto
    num_threads: 4
    mode: local
    server_url: http://100.49.250.232:8083
    server_key: ${DOCLING_API_KEY}
  by_kind:
    digital:
      table_source: auto
    scanned:
      table_source: auto
    mixed:
      table_source: auto
    default:
      table_source: auto
  large_format:
    enabled: true
    dpi: 200
    vlm_max_px: 2600
    overlap: 0.12
    merge: llm
    max_tiles: 24
  cad:
    max_pages: 0
    vision:
      provider: google
      model: gemini-3.5-flash
      api_key: ${GOOGLE_API_KEY}
      min_interval_s: 4.0
      max_retries: 3
      timeout_s: 150
      dpi: 200
embeddings:
  dense_provider: openai
  dense_model: text-embedding-3-small
  dense_api_key: ${OPENAI_API_KEY}
  dense_dim: 1024
  dense_document_prefix: ''
  dense_query_prefix: ''
  dense_batch_size: 16
  sparse_model: Qdrant/bm25
  reranker_provider: jina
  reranker_model: jina-reranker-v2-base-multilingual
  reranker_api_key: ${JINA_API_KEY}
  chunking_model: minishlab/potion-base-32M
chunking:
  strategy: semantic
  size: 400
  overlap: 50
  section_aware: true
  split_large_tables: true
enrichment:
  summarize: true
  keyword_count: 6
  min_interval_s: 0.3
  batch_size: 15
  provider: openai
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  prompt: 'You label document chunks for a technical search index. For each chunk
    produce a one-sentence summary stating what it is about and what a reader would
    learn (in the document''s own terms), plus 6-10 SPECIFIC search terms taken from
    the chunk — part numbers, model names, component/procedure names, specs and units,
    domain terms. Never use stopwords, generic words (information, section, manual),
    or terms not present in the chunk.

    '
query:
  small_corpus_tokens: 100000
  max_context_tokens: 0
  steps:
  - query_planner
  - retrieval
  - answerer
  planner:
    max_sub_questions: 4
  answerer: null
  hyde:
    enabled: false
  retrieval:
    method: hybrid_rerank
    top_n: 20
    candidate_k: 80
    rerank_top_k: 5
    dense_weight: 0.6
    sparse_weight: 0.4
    fallback_enabled: true
    fallback_threshold: -1.0
    fallback_top_k: 2
  agent:
    max_iterations: 8
    max_history_messages: 20
    provider: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    extra_body: {}
    write_tools:
    - ingest_document
document_types:
- invoice
- purchase_order
- financial_statement
- report
- research_paper
- manual
- contract
- policy
- datasheet
- presentation
- spreadsheet
- cad_drawing
- circuit_diagram
- schematic
- image
- unknown
industries:
- automotive
- electronics
- manufacturing
- finance
- legal
- healthcare
- retail_ecommerce
- travel_transport
- entertainment_media
- general
default_industry: general
type_to_route:
  cad_drawing: cad_route
  circuit_diagram: circuit_route
  schematic: diagram_heavy
  datasheet: diagram_heavy
  report: text_default
  research_paper: text_default
  manual: text_default
  invoice: text_default
  purchase_order: text_default
  financial_statement: text_default
  contract: text_default
  policy: text_default
  presentation: text_default
  spreadsheet: text_default
  image: image_route
  unknown: text_default
extractors:
  excel: excel_extraction
  ppt: ppt_extraction
  docx: word_extraction
  image: image_extraction
pdf_extractors:
  digital: docling_pdf
  scanned: docling_pdf
  mixed: docling_pdf
route_extractors:
  cad_route: cad_extract
  circuit_route: cad_extract
routes:
  text_default:
    steps:
    - categorize
    - extract
    - chunk
    - enrich_chunks
    - embed
    - index
  diagram_heavy:
    steps:
    - categorize
    - extract
    - vision_enrichment
    - chunk
    - enrich_chunks
    - embed
    - index
  cad_route:
    steps:
    - categorize
    - extract
    - cad_chunk_llm
    - embed
    - index
  circuit_route:
    steps:
    - categorize
    - extract
    - cad_chunk_llm
    - embed
    - index
  image_route:
    steps:
    - categorize
    - extract
    - vision_enrichment
    - chunk
    - enrich_chunks
    - embed
    - index
ingestion:
  steps:
  - categorize
  - extract
  - vision_enrichment
  - chunk
  - cad_chunk_llm
  - enrich_chunks
  - embed
  - index
  route_gates:
    vision_enrichment:
    - text_default
    - diagram_heavy
    - image_route
    chunk:
    - text_default
    - diagram_heavy
    - image_route
    enrich_chunks:
    - text_default
    - diagram_heavy
    - image_route
    cad_chunk_llm:
    - cad_route
    - circuit_route
database:
  postgres_url: ${POSTGRES_URL}
  qdrant_url: ${QDRANT_URL}
  qdrant_api_key: ${QDRANT_API_KEY}
  qdrant_collection: chunks
auto_ingestion:
  enabled: true
  watch_dir: auto_ingest
  poll_interval: 10
guardrails:
  enabled: true
  version: 1.0.0
  policy:
    block_threshold: 80
    warn_threshold: 40
    bypass_alert_rate: 0.05
    stage_weights:
      input: 1.0
      retrieval: 1.2
      output: 1.5
  input:
    max_query_chars: 2000
    pii_redact: true
    injection_check: true
    encoding_entropy_check: false
    off_topic_check: false
    passport_pattern: false
    voter_id_pattern: false
  retrieval:
    chunk_injection_scan: true
    scan_max_bytes: 100000
  output:
    pii_mask: true
    gstin_before_pan: true
    groundedness:
      enabled: false
      fail_open: true
      timeout_ms: 3000
  token_quota:
    enabled: true
    window_minutes: 60
    tokens_per_window: 500000
    reserve_tokens: 2000
    fail_open: true
  token_budget:
    enabled: true
    max_context_tokens: 20000
  trust_registry:
    manual: 1.0
    datasheet: 1.0
    contract: 0.95
    invoice: 0.85
    image: 0.6
    unknown: 0.5
  session_risk:
    enabled: true
    window_minutes: 30
    session_block_threshold: 150
    redis_url: null
  degradation:
    qdrant_max_retries: 2
    qdrant_base_delay_s: 0.5
    reranker_max_retries: 2
    reranker_base_delay_s: 0.5
    reranker_max_pairs: 50
    reranker_max_tokens_per_pair: 512
    reranker_max_total_tokens: 10000
  rollout:
    input_guard_pct: 100
    retrieval_guard_pct: 50
    output_guard_pct: 100
    token_quota_pct: 5
    session_risk_pct: 20
  logging:
    enabled: true
    ring_buffer_size: 500
  health_probe:
    enabled: true
    interval_seconds: 60
  cost:
    enabled: true
models_cost:
  gpt-4o-mini:
    input: 0.15
    output: 0.6
  gpt-4o:
    input: 2.5
    output: 10.0
  llama-3.1-8b-instruct:
    input: 0.0
    output: 0.0
  meta/llama-3.1-8b-instruct:
    input: 0.0
    output: 0.0
  gemini-2.5-flash:
    input: 0.3
    output: 2.5
  meta/llama-3.2-11b-vision-instruct:
    input: 0.0
    output: 0.0
  text-embedding-3-small:
    input: 0.02
    output: 0.0
  jina-embeddings-v3:
    input: 0.0
    output: 0.0
storage:
  provider: supabase
  supabase_url: ${SUPABASE_URL}
  supabase_key: ${SUPABASE_SERVICE_KEY}
  supabase_bucket: documents
