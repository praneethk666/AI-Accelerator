# Global pipeline configuration.
# Override per-deployment by copying this file and passing the new path to load_config().
# Secrets (API keys, DB passwords) go in .env — never in this file.
# Database connection strings use ${VAR} substitution resolved from the environment.

# ── LLM ───────────────────────────────────────────────────────────────────────
# provider: groq | google | ollama | openai
# `openai` + base_url reaches ANY OpenAI-compatible API (NVIDIA NIM, OpenRouter,
# Together, z.ai, DeepSeek, vLLM, …). api_key is usually a ${ENV_VAR}; blank => SDK's
# default env.
# Recipes:
#   OpenAI (active): provider: openai  model: gpt-4o-mini  base_url: https://api.openai.com/v1  api_key: ${OPENAI_API_KEY}
#   z.ai GLM:        provider: openai  model: glm-4.7-flash
#                    base_url: https://api.z.ai/api/paas/v4/  api_key: ${ZAI_API_KEY}
#   Groq:            provider: groq    model: llama-3.1-8b-instant   api_key: ${GROQ_API_KEY}
#   Gemini (AI Studio): provider: google  model: gemini-2.5-flash   api_key: ${GOOGLE_API_KEY}
#   DeepSeek:        provider: openai  model: deepseek-chat
#                    base_url: https://api.deepseek.com/v1           api_key: ${DEEPSEEK_API_KEY}
#   NVIDIA NIM:      provider: openai  model: meta/llama-3.1-8b-instruct
#                    base_url: https://integrate.api.nvidia.com/v1   api_key: ${NVIDIA_API_KEY}
#   OpenRouter:      provider: openai  model: <org/model>
#                    base_url: https://openrouter.ai/api/v1          api_key: ${OPENROUTER_API_KEY}
#   Local vLLM:      provider: openai  model: <served>  base_url: http://localhost:8001/v1
llm:
  # ACTIVE (27-Jul, v5): OpenAI gpt-4o-mini (PAID) — moved off z.ai GLM after this
  # project's whole 24-Jul session got repeatedly blocked by its real concurrency
  # ceiling (1-2 concurrent calls). Chose gpt-4o-mini specifically over any gpt-5
  # family model: gpt-5 variants have a VERSION-DEPENDENT default reasoning_effort
  # (some default to "medium" = real hidden-token cost, gpt-5.1 defaults to "none")
  # — exactly the silent-waste trap this project already got burned by twice
  # (Gemini 2.5 thinking mode, GLM thinking mode) — not worth the risk without a
  # live test to confirm each specific version. gpt-4o-mini has no reasoning_effort
  # parameter at all (not a reasoning-model family), so there's nothing to leak.
  # Cheapest OpenAI option too ($0.15/$0.60 per 1M in/out, verified 27-Jul) — a full
  # manual's ingestion should land well under $1 given this project's own prior
  # measured vision-call costs at similar volume (~$0.02 for 259 calls elsewhere).
  provider: openai
  model: gpt-4o-mini
  answer_model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2
  # max_tokens:             # default completion cap; enrich_chunks sizes its own per batch
  # ── Alternatives (swap provider/model above) ──────────────────────────────────
  # Gemini 2.5-flash (PAID, ACTIVE 21-Jul -> 24-Jul, then Google retired the model
  #           for this key — 404 "no longer available to new users"): provider: google
  #           model: gemini-2.5-flash  api_key: ${GOOGLE_API_KEY}  thinking_budget: 0
  #           If you revive Gemini, use gemini-flash-latest (an alias Google keeps
  #           repointed at their current model) instead of a pinned version, or this
  #           exact failure recurs. thinking_budget: 0 is still REQUIRED for the
  #           Gemini 2.5 family (Gemma models use thinking_level instead) — validated
  #           21-Jul: without it a ONE-SENTENCE summary burned 424/443 output tokens
  #           on hidden reasoning (96% waste).
  # OpenAI (PAID):  provider: openai  model: gpt-4o-mini  answer_model: gpt-4o-mini  api_key: ${OPENAI_API_KEY}
  # DeepSeek (cheap paid, ~$0.87/M out — never validated for quality in this
  #           project, fallback only): provider: openai  model: deepseek-chat
  #           base_url: https://api.deepseek.com/v1  api_key: ${DEEPSEEK_API_KEY}
  # Groq (free):    provider: groq    model: llama-3.1-8b-instant  answer_model: llama-3.3-70b-versatile  api_key: ${GROQ_API_KEY}
  #                 NOTE: Groq free tier caps EACH model at ~100K tokens/day (per-model bucket) — hit this 15-Jul.
  # Anthropic:      provider: anthropic  model: claude-haiku-4-5  answer_model: claude-haiku-4-5  api_key: ${ANTHROPIC_API_KEY}

# ── Per-step model overrides (MODULAR) ────────────────────────────────────────
# Any step below may pin its OWN model (and optionally provider/api_key/base_url/
# temperature); anything unset inherits the global llm block above. Cost/quality knob:
# run bulk enrichment on a cheap model, answering on a stronger one, etc. Resolution is
# always: step.model -> (answer_model for plan/answer) -> global llm.model.
#   categorization.model     categorize/classify document_type + industry
#   enrichment.model         per-chunk summary + keywords (bulk — biggest cost lever)
#   query.planner.model      query rewriting/decomposition
#   query.answerer.model     final grounded answer
# Handled in code by get_llm_for(config, section) — see backend/core/llm_client.py.

# ── Vision ────────────────────────────────────────────────────────────────────
# provider: google (AI Studio) | ollama (self-hosted) | openai (any OpenAI-compatible
# multimodal endpoint via base_url — GPT-4o-vision, NVIDIA NIM VLMs, OpenRouter).
vision:
  # ONE vision model for ALL vision tasks (categorize + figure captioning), matching
  # vision_ocr so cropping/grounding/transcription all use the same model.
  # ACTIVE (27-Jul, v4): OpenAI gpt-4o-mini (PAID) — matches the llm: block above
  # (same move, same reason: z.ai's concurrency ceiling repeatedly blocked bulk
  # ingestion). Not yet re-validated on this project's own real warning-icon
  # classification test the way GLM-4.6V-Flash and NVIDIA's nemotron were on
  # 24-Jul — do that before trusting icon-vs-figure classification blindly.
  # IMPORTANT FINDING (provider-independent, still true): on the Toyota GL32Mi-63
  # spec-table page, GENERAL VLM table transcription (the VLM-escalation path below,
  # extraction.by_kind.*.table_source) is structurally worse than pymupdf's ruled-line
  # extraction — confirmed on THREE different vision models (raw TableFormer,
  # GLM-4.6V-Flash, NVIDIA nemotron-nano-12b-v2-vl). Don't rely on any VLM for table
  # structure regardless of provider; general figure/photo captioning (this block's
  # actual job) is a different, lower-precision task. Self-hosted Unlimited-OCR
  # (backend/extraction/unlimited_ocr.py) is the validated alternative for hard
  # tables specifically — see extraction.docling.table_engine below.
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  # ── Alternatives (swap provider/model above) ──────────────────────────────────
  # z.ai GLM-4.6V-Flash (FREE, real concurrency=1-2 ceiling — caused repeated 429s
  #           under bulk load 24-Jul): provider: openai  model: glm-4.6v-flash
  #           base_url: https://api.z.ai/api/paas/v4/  api_key: ${ZAI_API_KEY}
  #           extra_body: { thinking: { type: disabled } }
  # Gemini 2.5-flash (PAID, RETIRED by Google 24-Jul — 404 "no longer available to
  #           new users"): provider: google  model: gemini-2.5-flash (or
  #           gemini-flash-latest, an alias that won't suffer this exact failure
  #           again)  api_key: ${GOOGLE_API_KEY}
  # Gemma-4-31b-it on Google AI Studio (cheaper but 30 RPM/16K-TPM hard quota):
  #           provider: google  model: gemma-4-31b-it  api_key: ${GOOGLE_API_KEY}
  # NVIDIA Build API (fast, but MISCLASSIFIED a real warning icon as page furniture
  #           24-Jul — verify before trusting): provider: openai
  #           model: nvidia/nemotron-nano-12b-v2-vl
  #           base_url: https://integrate.api.nvidia.com/v1  api_key: ${NVIDIA_API_KEY}
  # Cerebras + Gemma4 (untested — needs CEREBRAS_API_KEY, benchmark before trusting):
  #           provider: openai  model: gemma-4-31b  base_url: https://api.cerebras.ai/v1
  #           api_key: ${CEREBRAS_API_KEY}
  # Self-hosted Qwen3-VL (private):  provider: openai  model: qwen3-vl
  #                                  base_url: http://<your-gpu-host>:8000/v1  api_key: ${VLLM_API_KEY}
  # NVIDIA llama-3.2-11b-vision (a teammate's alternative, untested against this
  # project's own real warning-icon/table-accuracy checks as of this merge —
  # provider: openai  model: meta/llama-3.2-11b-vision-instruct
  # base_url: https://integrate.api.nvidia.com/v1  api_key: ${NVIDIA_API_KEY}
  enabled: true
  dpi: 150                  # render resolution for PDF image regions
  min_image_px: 150         # images smaller than this (each side) are skipped
  timeout_s: 120
  max_retries: 5            # retry/backoff is the safety net for transient 429/5xx
  max_concurrency: 1        # REDUCED from 3 (27-Jul) — see min_interval_s note below;
                             # concurrent in-flight calls add real demand on top of what
                             # interval-pacing between call STARTS accounts for.
  min_interval_s: 1.0       # RAISED from 0.5 (27-Jul) — real finding on gpt-4o-mini:
                             # this project's own pacing.pace() only paces REQUEST rate
                             # (built for free-tier RPM caps like Gemma/Groq), but
                             # gpt-4o-mini's real binding constraint is TOKENS per minute
                             # (200K TPM, this account's actual tier). Live-tested during
                             # a real 105-page extraction run: 0.5s pacing (~120
                             # calls/min) with max_concurrency=3 repeatedly hit "Used
                             # 200000, Limit 200000" and LOST multiple figure captions
                             # entirely (pages 11, 13, 26, 29, 30, 33, 35+ all failed
                             # after exhausting retries) — real data loss, not just
                             # slowness. Each caption call costs ~1200-1300 tokens
                             # (observed in the 429 error bodies), so the theoretical
                             # math (120/min x 1250 ~= 150K, under 200K) didn't hold up
                             # in practice — went more conservative empirically rather
                             # than re-deriving the exact real window mechanics.
                             # Re-verify with a live rerun before raising either value
                             # again; don't just trust the arithmetic.
  # Focus instructions, selected by route first, then industry, then "default"
  # (see backend/vision/prompts.py:build_vision_prompt). Add a customer's industry
  # key here to tune captions without code changes.
  prompt:
    default: >
      Describe what this image shows in 2-3 sentences. Be specific about the type of
      visual (diagram, chart, photo, schematic) and capture component labels, part
      numbers, dimensions, and any visible text VERBATIM (do not paraphrase numbers).
    automotive: >
      You are analyzing a page from a vehicle/equipment service manual. Capture
      exploded views and assembly diagrams, part names and part numbers, callout
      numbers, fasteners, torque/clearance specs, and any labels, warnings, or
      measurements. Be precise — this is used for parts/maintenance search.
    cad_route: >
      Describe all visible circuit components, reference designators (R1, C4),
      net names (e.g. 5V_RAIL, GND), connector types, pin counts, and any
      visible dimensions or tolerances. Be precise — this is used for search.

# ── Vision-OCR (page transcription for COMPLEX pages) ─────────────────────────
# Routed VLM transcription: when native text is garbled (broken fonts) or a page has
# tables/figures, render the page and let a document VLM transcribe it (clean text +
# correct markdown tables) — what pymupdf/OCR get wrong. Runs ONLY on flagged pages
# (mode: complex), so it's cheap. provider: openai covers any OpenAI-compatible VLM
# API (below: NVIDIA Build API for testing). Set mode: off to disable, always to force.
vision_ocr:
  enabled: true
  mode: always              # off (native/Paddle only) | complex (hybrid: cheap + VLM on
                            # hard pages) | always (VLM-ONLY: skips Paddle/pymupdf entirely)
                            # NOTE: z.ai's throughput ceiling (see llm:/vision: blocks)
                            # applies here too — if scanned-page ingestion gets too
                            # slow, drop this to "complex" so only flagged pages pay
                            # for a VLM call instead of every page.
  # ACTIVE (27-Jul, v4): OpenAI gpt-4o-mini — matches the vision: block above (same
  # provider swap, same reason: z.ai's concurrency ceiling kept blocking bulk work).
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  # ── Alternatives (swap provider/model above) ──────────────────────────────────
  # z.ai GLM-4.6V-Flash (FREE, real concurrency=1-2 ceiling):
  #           provider: openai  model: glm-4.6v-flash
  #           base_url: https://api.z.ai/api/paas/v4/  api_key: ${ZAI_API_KEY}
  #           extra_body: { thinking: { type: disabled } }
  # Gemini 2.5-flash (PAID, RETIRED by Google — see vision: block above):
  #           provider: google  model: gemini-2.5-flash (or gemini-flash-latest)
  #           api_key: ${GOOGLE_API_KEY}
  # Gemma-4-31b-it (cheaper but 30 RPM/16K-TPM hard quota, not worth it):
  #           provider: google  model: gemma-4-31b-it  api_key: ${GOOGLE_API_KEY}
  # NVIDIA Build API (fast, unverified accuracy — see vision: block above):
  #           provider: openai  model: nvidia/nemotron-nano-12b-v2-vl
  #           base_url: https://integrate.api.nvidia.com/v1  api_key: ${NVIDIA_API_KEY}
  # Self-hosted Qwen3-VL:  provider: openai  model: qwen3-vl
  #                        base_url: http://<your-gpu-host>:8000/v1  api_key: ${VLLM_API_KEY}
  engine: vlm               # vlm (default, above) | local (self-hosted Unlimited-OCR —
                             # see backend/extraction/unlimited_ocr.py + scripts/ocr_server.py).
                             # Live-tested 24-Jul on the real 105-page servo manual: zero
                             # repetition across 7 diverse pages, correctly-structured
                             # rowspan HTML tables, ~26-30s/page on a T4 GPU — a real fix
                             # for z.ai's concurrency=1-2 rescue-path bottleneck, but NOT
                             # yet tested on diagram/large-format tiled pages, so leave as
                             # "vlm" until a GPU inference server is actually running.
  # Public repo — the box IP is env-substituted, not hardcoded here (set both in
  # your local .env, never commit real values):
  local_endpoint: ${UNLIMITED_OCR_ENDPOINT}  # e.g. http://<gpu-box-ip>/unlimited-ocr/infer
  local_api_key: ${UNLIMITED_OCR_API_KEY}    # shared secret, must match the server's env var
  local_timeout_s: 90
  # PaddleOCR-VL-1.6 — a SEPARATE server/port (scripts/paddleocr_vl_server.py,
  # default port 8084), not the same process as local_endpoint above. Real
  # finding, 28-Jul: torch (unlimited_ocr/surya's stack) and paddlepaddle-gpu
  # pin mutually exclusive nvidia-*-cu12 versions — confirmed live, can't share
  # a venv/process. Used by extraction.docling.local_table_ocr_engine: paddleocr_vl.
  local_paddleocr_vl_endpoint: ${PADDLEOCR_VL_ENDPOINT}  # e.g. http://<gpu-box-ip>:8084/infer
  local_paddleocr_vl_api_key: ${PADDLEOCR_VL_API_KEY}    # must match the server's env var
  dpi: 150
  min_interval_s: 1.0       # MUST match vision.min_interval_s — both blocks call the
                             # same model through the same pacing.pace("vision", ...)
                             # key (backend/core/vision_client.py); a mismatch here
                             # would let these calls skip pacing while still drawing
                             # from the same shared per-minute quota. Real finding,
                             # 28-Jul: this had drifted out of sync with vision's own
                             # 0.5->1.0 raise (27-Jul, same gpt-4o-mini TPM root cause)
                             # — caught live via a real 429 storm during a fresh
                             # 105-page ingestion's page-rescue figure captions.
  max_retries: 3
  timeout_s: 120

# ── OCR (scanned pages) ───────────────────────────────────────────────────────
# Engine picked per deployment (surya|paddle — see extraction/scanned_pdf/).
# engine: surya | paddle
#   surya  — torch + llama.cpp; ONE pass gives text + layout, 90+ languages, best
#            accuracy on complex layouts. Needs llama-server binary. Best on GPU.
#   paddle — PaddleOCR text + DocLayout-YOLO/contour regions. CNN recognition,
#            reliable and fast on CPU. DEFAULT for CPU/dev.
ocr:
  engine: paddle            # CPU default.
  layout_engine: auto       # auto | surya | contour
  surya_timeout_s: 90       # Surya bounds per page before falling back to PaddleOCR
  subprocess_timeout_s: 1800 # Overall OCR process timeout

# ── Extraction platform (Docling) ─────────────────────────────────────────────
# Docling (IBM, MIT) is the maintained document-AI engine: layout model + reading
# order, TableFormer for real table structure, OCR for scanned pages, figure
# localization. ONE tool (docling_pdf) covers digital/scanned/mixed. It runs on CPU
# (dev) and auto-accelerates on a CUDA GPU — same code, just set device.
# Also supports dedicated remote extraction microservice via mode: server.
extraction:
  deskew: true                # auto-rotate sideways scans via Tesseract OSD
  stitch_tables: true         # merge tables that continue across page breaks
  stitch_arbitration: true    # ask LLM to arbitrate ambiguous table continuations
  docling:
    do_ocr: false             # Docling internal OCR (false = use VLM rescue / Paddle)
    do_table_structure: true  # TableFormer: recover rows/cols (vs flat text)
    images_scale: 2.0         # internal render scale for layout/figures
    min_picture_pts: 24       # skip regions smaller than this on a side
    min_picture_area_frac: 0.004
    figure_union: true        # union Docling + DocLayout-YOLO figures
    page_rescue: true         # per-page VLM rescue for garbled/scanned pages
    max_vlm_pages: 60         # budget cap for VLM page transcriptions per doc
    device: auto              # auto | cpu | cuda | mps
    num_threads: 4
    table_engine: local       # vlm (default, hosted) | local (self-hosted engine, picked
                              # by local_table_ocr_engine below). ONLY affects per-table-
                              # crop escalation (table_source: vlm/auto+complex below) —
                              # a DIFFERENT trigger than vision_ocr.engine, which is
                              # whole-PAGE rescue for scanned/garbled pages. Real finding,
                              # 27-Jul: whole-page parsing dropped every value from a
                              # dense nested table on a real scanned invoice; cropping
                              # just that table alone got them 100% correct — this is the
                              # validated integration point, but needs the GPU server
                              # (scripts/ocr_server.py) actually running, so stays "vlm"
                              # until that's confirmed up for a given run.
    local_table_ocr_engine: paddleocr_vl  # paddleocr_vl | unlimited_ocr — which self-
                              # hosted server handles table_engine: local above.
                              # paddleocr_vl (ACTIVE, 27-Jul): scripts/paddleocr_vl_server.py
                              # (separate process/port, 8084 — see vision_ocr.
                              # local_paddleocr_vl_endpoint above). Two-stage layout+
                              # recognition, live-tested on the 3 hardest known real
                              # tables from this project's servo manual (2 that OOM'd
                              # unlimited_ocr at every base_size, 1 where unlimited_ocr
                              # silently dropped a row) — all 3 transcribed perfectly.
                              # unlimited_ocr: the previous engine (scripts/ocr_server.py +
                              # backend/extraction/unlimited_ocr.py), kept available with
                              # its own OOM-retry-ladder/split-crop fallback — see
                              # backend/extraction/paddleocr_vl.py for the tradeoffs, and
                              # its docstring for why these are two separate servers
                              # (torch/paddlepaddle-gpu have a hard, unresolvable
                              # nvidia-*-cu12 version conflict when installed together).
                              # Falls back to vlm automatically if the local call fails.
    # Remote Docling server (optional). Set mode: remote to offload all Docling
    # GPU work to the server at server_url instead of running it locally.
    # When mode: remote, ALL table_source / figure detection happens on the server;
    # figure captioning (VLM semantic gate) still runs locally via vision_ocr.
    # Leave mode: local (default) to keep the current behavior unchanged.
    mode: local               # local | remote (extract_docling checks for the literal
                              # string "remote" -- see backend/extraction/docling_remote.py)
    server_url: ${DOCLING_SERVER_URL}  # e.g. http://<gpu-box-ip>:8083 -- real finding:
                              # this project's load_config() only does plain ${VAR}
                              # substitution (backend/core/config.py), no bash-style
                              # ${VAR:-default} -- that syntax silently fails to resolve
                              # (the whole ":-default" gets treated as part of the env
                              # var NAME to look up) even when VAR is set correctly.
    server_key: ${DOCLING_API_KEY}
    timeout_s: 600
  # Per pdf-kind extraction policy. text + figures use Docling everywhere (+ the
  # per-page VLM rescue); the tunable knob is TABLES:
  #   auto    -> TableFormer for simple tables; for COMPLEX ones (merged cells or
  #              multi-line headers), try pymupdf's ruled-line geometry first (free,
  #              validated 21-Jul: reproduced a 37-row merged-cell Toyota spec table
  #              cleanly where TableFormer AND the VLM both garbled row alignment),
  #              falling back to VLM only if pymupdf finds no ruled table there
  #              (scanned pages, borderless tables). Best of both, free-first. Default.
  #   pymupdf -> always try ruled-line geometry (free); TableFormer if no match found.
  #              Use when a corpus is mostly clean ruled/digital tables and you want
  #              to skip VLM spend entirely for tables.
  #   docling -> always TableFormer (free). vlm -> always crop+VLM.
  by_kind:
    digital:
      table_source: auto
    scanned:
      table_source: auto
    mixed:
      table_source: auto
    default:
      table_source: auto
  # Large-format / diagram pages (CAD, circuit schematics, oversized engineering sheets).
  # Tiles high-DPI renders to preserve legible component designators.
  large_format:
    enabled: true
    dpi: 200
    vlm_max_px: 2600
    overlap: 0.12
    merge: llm                # llm = dedup-merge tiles via LLM; concat = join
    max_tiles: 24
  cad:
    max_pages: 0              # cap VLM pages per CAD/circuit doc (0 = unlimited)

# ── Embeddings & Reranker ─────────────────────────────────────────────────────
# Provider can be "openai", "local" (SentenceTransformers), or "jina" (cloud API).
# Dense dimension, models, and rerankers swap automatically via Settings UI.
embeddings:
  dense_provider: openai                # openai | local | jina
  dense_model: text-embedding-3-small   # OpenAI text-embedding-3-small, BAAI/bge-m3, or jina-embeddings-v3
  dense_api_key: ${OPENAI_API_KEY}
  dense_dim: 1024                       # Matryoshka output dimension for text-embedding-3-small
  dense_document_prefix: ''             # prefix required for some models (e.g. nomic)
  dense_query_prefix: ''
  dense_batch_size: 16
  sparse_model: Qdrant/bm25             # keyword matching for hybrid search
  reranker_provider: jina               # jina | local
  reranker_model: jina-reranker-v2-base-multilingual # jina-reranker-v2-base-multilingual or BAAI/bge-reranker-v2-m3
  reranker_api_key: ${JINA_API_KEY}
  chunking_model: minishlab/potion-base-32M # SemanticChunker split bounds model

# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  strategy: semantic        # semantic | recursive
  size: 400                 # tokens (not characters)
  overlap: 50               # tokens
  section_aware: true       # break chunks at headings (section-scoped) + tag the
                            # section; images stay atomic (never split).
  split_large_tables: true  # tables ARE atomic (one chunk) UNLESS bigger than `size`
                            # tokens rendered — then split by ROW GROUP with the header
                            # repeated in every sub-chunk (source_ref gets table_part/
                            # table_parts/table_row_range). Validated 21-Jul on a 37-row
                            # Toyota spec table: as one chunk, a single-row query ("wheel
                            # spindle power") retrieves the whole table; row-grouped, it
                            # retrieves the 3-4 rows that matter. false = old behavior
                            # (always one chunk per table, however large).
  repair_hard_tables: true # a table with broken headers/rows, <=2 rows, or that
                            # strips away a context anchor its surrounding text names
                            # (e.g. 'Alarm code 11H' never repeated in the table's own
                            # cells) gets ONE LLM call (backend.chunking.chunk_tool.
                            # _repair_table_with_llm) to rewrite it into self-contained,
                            # context-enriched row chunks. Uses the section's own
                            # LLM settings below (no separate `chunking:` provider/model
                            # set here -> falls back to global `llm.*`, i.e. Gemini
                            # 2.5-flash, already paid+validated — not the unvalidated
                            # DeepSeek originally proposed). Fails closed: any parse/
                            # validation failure discards the repair and falls through
                            # to the normal deterministic table chunkers, so a bad LLM
                            # response can never mean the table gets dropped.
  min_interval_s: 1.0      # Real finding, 28-Jul: table-repair (_repair_table_with_llm,
                            # above) AND cross-page stitch arbitration
                            # (table_reconcile.py::_llm_is_continuation) had ZERO pacing
                            # at all, unlike vision/vision_ocr/enrichment — both draw from
                            # the SAME shared gpt-4o-mini per-minute token budget, so on a
                            # real 105-page run this caused a real 429 storm during the
                            # chunk step (245 back-to-back repair calls + 14 stitch calls,
                            # no spacing): 6 pages lost rescue, 7/14 stitches failed, and
                            # an uncertain share of that run's 36 repair-validation
                            # rejections were rate-limit-degraded output rather than the
                            # validator's normal healthy rejection rate. Reusing the SAME
                            # 1.0s value already validated for gpt-4o-mini (vision block
                            # above) rather than introducing a second number that could
                            # drift out of sync the same way vision_ocr's copy just did.
                            # ONE shared config key, read directly by BOTH call sites
                            # (chunk_tool.py AND table_reconcile.py) — not two separate
                            # values kept in sync by hand.

# ── Enrichment ────────────────────────────────────────────────────────────────
# enrich_chunks stamps tags + summary + semantic search terms on each chunk.
enrichment:
  summarize: true
  keyword_count: 6
  min_interval_s: 0.3
  batch_size: 15
  provider: openai
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  prompt: >
    You label document chunks for a technical search index. For each chunk produce a one-sentence
    summary stating what it is about and what a reader would learn (in the document's own terms), plus
    6-10 SPECIFIC search terms taken from the chunk — part numbers, model names, component/procedure names,
    specs and units, domain terms. Never use stopwords, generic words (information, section, manual),
    or terms not present in the chunk.

# ── Query Pipeline ────────────────────────────────────────────────────────────
query:
  small_corpus_tokens: 100000   # below this threshold, adaptive_router skips retrieval
  max_context_tokens: 0         # answer_tool context budget (0 = dynamic)
  steps:
    - query_planner
    - retrieval
    - answerer
  planner:
    max_sub_questions: 4        # QueryPlannerTool: cap on decomposed sub-questions
    # model:                    # override; unset => answer_model, then global llm.model

  answerer:
    # model:                    # override; unset => answer_model, then global llm.model
    image_ground:
      # Attach the top-ranked citation(s)' real PAGE IMAGE to the answer LLM
      # call so it can visually cross-check extracted text against the source
      # page. Real finding, 28-Jul: a table's "Indication" 7-segment-display
      # icon column was misread by the table-OCR engine on 9/11 rows while
      # every other column was correct — an LLM that can SEE the page has a
      # real chance to catch/correct this the text alone can't reveal.
      # OFF by default: adds one extra image-token cost per grounded citation
      # on every answer, and requires the configured answer model/provider to
      # be vision-capable (gpt-4o-mini is; verify live before enabling on any
      # other provider/model). Reuses the JPEG already rendered at ingestion
      # (document_pages, backend/pipeline/page_images.py) — no extra render
      # cost either way.
      enabled: false
      top_k: 1        # top-ranked DISTINCT-page PDF citations to attach an image for (1-2 recommended)

  hyde:
    enabled: false              # generate hypothetical answer before encoding
  retrieval:
    method: hybrid_rerank       # naive | hybrid | hybrid_rerank | hyde | enriched
    top_n: 20                   # fused chunks returned by plain hybrid
    candidate_k: 80             # wide candidate pool for reranker scoring
    rerank_top_k: 5             # chunks kept after reranking
    dense_weight: 0.6           # RRF weight for dense vector leg
    sparse_weight: 0.4          # RRF weight for sparse/BM25 leg
  agent:
    max_iterations: 5           # maximum tool-calling reasoning turns
    max_history_messages: 20    # sliding window of conversation messages
    provider: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    extra_body: {}
    write_tools:
      - ingest_document         # human approval required before running write tools

# ── Document Taxonomy ─────────────────────────────────────────────────────────
document_types:
  - invoice
  - purchase_order
  - financial_statement
  - report
  - research_paper
  - manual
  - contract
  - policy
  - datasheet
  - presentation
  - spreadsheet
  - cad_drawing
  - circuit_diagram
  - schematic
  - image
  - unknown

industries:
  - automotive
  - electronics
  - manufacturing
  - finance
  - legal
  - healthcare
  - retail_ecommerce
  - travel_transport
  - entertainment_media
  - general

default_industry: general

# ── Categorization ────────────────────────────────────────────────────────────
# ── Deployment (per-customer narrow-scope overrides) ──────────────────────────
# For a deployment where the document type is ALWAYS known ahead of time (a
# customer whose documents are exclusively, say, automotive service manuals, or
# exclusively invoices) — force_document_type skips the categorize LLM/vision
# call entirely (backend/categorize/categorize_tool.py::_forced_result), since
# the classification would land on the same answer every single time anyway.
# Cheap either way (~$0.0005-0.001/doc, one vision call on pages 1-3) but real,
# avoidable cost+latency at high volume for a single-purpose install. Leave
# force_document_type unset (the default) for a general-purpose multi-industry
# deployment — classification then runs normally, as it does today.
deployment:
  # force_document_type:      # e.g. "manual" — see document_types below for the
                               # full vocabulary. Setting this enables the bypass.
  # force_industry:           # defaults to default_industry if unset
  # force_route:              # defaults to type_to_route[force_document_type]
  default_industry: general   # fallback when classification confidence is low
                               # (used regardless of the bypass above)

# Used by CategorizeTool.
# config["categorization"]["industry_keywords"] — keyword lists per industry
# config["categorization"]["confidence_thresholds"] — when to flag low confidence
categorization:
  confidence_thresholds:
    categorization_low_confidence: 0.5

  # Each industry: strong (a single hit is real evidence -- brand names, acronyms,
  # terms genuinely exclusive to that domain) vs weak (plausible but shared with
  # adjacent domains -- needs more corroboration). Real finding, 27-Jul: a flat list
  # let 3 WEAK automotive terms (torque, chassis, transmission) cluster together and
  # false-positive on a non-automotive industrial manual even past a 2-hit threshold
  # -- weighted scoring (strong=2, weak=1, need score>=2) fixes this: 3 weak hits
  # alone score 3 and still pass (real corroboration), but so does 1 strong hit,
  # while 1 weak hit alone (score=1) correctly does NOT. See _score_industry_from_text.
  industry_keywords:
    automotive:
      strong: [toyota, ford, bmw, honda, "vehicle identification number", odometer, dealership, "catalytic converter", "spark plug"]
      weak: [automotive, vehicle, sedan, hatchback, "trim level", "curb weight", "fuel economy", windshield, airbag, powertrain]
    electronics:
      strong: [pcb, semiconductor, oscilloscope, microcontroller]
      weak: [circuit, schematic, voltage, resistor, capacitor, signal, "servo motor", actuator, amplifier]
    manufacturing:
      strong: [bom, "bill of materials", "approved manufacturer list"]
      weak: [assembly, drawing, tolerance, weld, machining, fixture, jig, "part number", "cycle time", "production line", changeover, "work order", "standard operating procedure"]
    finance:
      strong: ["balance sheet", "financial statement", gaap, "cash flow statement"]
      weak: [revenue, profit, ledger, audit, fiscal, equity, "accounts payable", "accounts receivable", "quarterly earnings"]
    legal:
      strong: [plaintiff, defendant, arbitration, indemnity, "force majeure"]
      weak: [contract, agreement, clause, liability, jurisdiction, "governing law", litigation, "intellectual property"]
    healthcare:
      strong: [diagnosis, "clinical trial", "informed consent", "icd-10", prescription]
      weak: [patient, clinical, pharma, dosage, trial, medical, drug, therapy, "adverse event"]
    retail_ecommerce:
      strong: [order id, add to cart, sku, cart total]
      weak: [delivery address, shipped, return policy, mrp]
    travel_transport:
      strong: [pnr, boarding point, coach number]
      weak: [seat number, departure time, ticket number, passenger name, bus operator]
    entertainment_media:
      strong: [showtime, movie ticket, multiplex, cinema hall]
      weak: [screen number, booking id, seat no, show timing]
    general:
      strong: []
      weak: []

# ── Routing ───────────────────────────────────────────────────────────────────
# Maps document_type → route name. The route selects which pipeline steps run.
type_to_route:
  cad_drawing: cad_route
  circuit_diagram: circuit_route
  schematic: diagram_heavy
  datasheet: diagram_heavy
  report: text_default
  research_paper: text_default
  manual: text_default
  invoice: text_default
  purchase_order: text_default
  financial_statement: text_default
  contract: text_default
  policy: text_default
  presentation: text_default
  spreadsheet: text_default
  image: image_route
  unknown: text_default

extractors:
  excel: excel_extraction
  ppt: ppt_extraction
  docx: word_extraction
  image: image_extraction

pdf_extractors:
  digital: docling_pdf
  scanned: docling_pdf
  mixed: docling_pdf

route_extractors:
  cad_route: cad_extract
  circuit_route: cad_extract

routes:
  text_default:
    steps:
      - categorize
      - extract
      - chunk
      - enrich_chunks
      - embed
      - index
  diagram_heavy:
    steps:
      - categorize
      - extract
      - vision_enrichment
      - chunk
      - enrich_chunks
      - embed
      - index
  cad_route:
    steps:
      - categorize
      - extract
      - chunk
      - enrich_chunks
      - embed
      - index
  circuit_route:
    steps:
      - categorize
      - extract
      - chunk
      - enrich_chunks
      - embed
      - index
  image_route:
    steps:
      - categorize
      - extract
      - vision_enrichment
      - chunk
      - enrich_chunks
      - embed
      - index

# ── Ingestion Profile ─────────────────────────────────────────────────────────
ingestion:
  steps:
    - categorize
    - extract
    - vision_enrichment
    - chunk
    - enrich_chunks
    - embed
    - index
  route_gates:
    vision_enrichment:
      - text_default
      - diagram_heavy
      - image_route

# ── Database & Vector Storage ─────────────────────────────────────────────────
database:
  postgres_url: ${POSTGRES_URL}
  qdrant_url: ${QDRANT_URL}
  qdrant_api_key: ${QDRANT_API_KEY}
  qdrant_collection: chunks

# ── Directory Auto-Ingestion Watcher ──────────────────────────────────────────
auto_ingestion:
  enabled: true
  watch_dir: auto_ingest
  poll_interval: 10

# ── Guardrails (v5 Configuration) ─────────────────────────────────────────────
guardrails:
  enabled: true
  version: 1.0.0
  policy:
    block_threshold: 80
    warn_threshold: 40
    bypass_alert_rate: 0.05
    stage_weights:
      input: 1.0
      retrieval: 1.2
      output: 1.5
  input:
    max_query_chars: 2000
    pii_redact: true
    injection_check: true
    encoding_entropy_check: false
    off_topic_check: false
    passport_pattern: false
    voter_id_pattern: false
  retrieval:
    chunk_injection_scan: true
    scan_max_bytes: 100000
  output:
    pii_mask: true
    gstin_before_pan: true
    groundedness:
      enabled: false
      fail_open: true
      timeout_ms: 3000
  token_quota:
    enabled: true
    window_minutes: 60
    tokens_per_window: 500000
    reserve_tokens: 2000
    fail_open: true
  token_budget:
    enabled: true
    max_context_tokens: 20000
  trust_registry:
    manual: 1.0
    datasheet: 1.0
    contract: 0.95
    invoice: 0.85
    image: 0.6
    unknown: 0.5
  session_risk:
    enabled: true
    window_minutes: 30
    session_block_threshold: 150
    redis_url: null
  degradation:
    qdrant_max_retries: 2
    qdrant_base_delay_s: 0.5
    reranker_max_retries: 2
    reranker_base_delay_s: 0.5
    reranker_max_pairs: 50
    reranker_max_tokens_per_pair: 512
    reranker_max_total_tokens: 10000
  rollout:
    input_guard_pct: 100
    retrieval_guard_pct: 50
    output_guard_pct: 100
    token_quota_pct: 5
    session_risk_pct: 20
  logging:
    enabled: true
    ring_buffer_size: 500
  health_probe:
    enabled: true
    interval_seconds: 60
  cost:
    enabled: true
    llm_input_cost_per_1m: 0.075
    llm_output_cost_per_1m: 0.3
    embed_cost_per_1m: 0.0

# ── Cloud Object Storage (Supabase) ───────────────────────────────────────────
# Used for storing original document uploads and converted assets.
storage:
  provider: supabase
  supabase_url: ${SUPABASE_URL}
  supabase_key: ${SUPABASE_SERVICE_KEY}
  supabase_bucket: documents
