# Global pipeline configuration.
# Override per-deployment by copying this file and passing the new path to load_config().
# Secrets (API keys, DB passwords) go in .env — never in this file.
# Database connection strings use ${VAR} substitution resolved from the environment.

# ── LLM ───────────────────────────────────────────────────────────────────────
# provider: groq | google | ollama | openai
# `openai` + base_url reaches ANY OpenAI-compatible API (NVIDIA NIM, OpenRouter,
# Together, vLLM, …). api_key is usually a ${ENV_VAR}; blank => SDK's default env.
# Recipes:
#   Groq (default): provider: groq    model: llama-3.1-8b-instant   api_key: ${GROQ_API_KEY}
#   Gemini/Vertex:  provider: google  model: gemini-1.5-flash       api_key: ${GOOGLE_API_KEY}
#   NVIDIA NIM:     provider: openai  model: meta/llama-3.1-8b-instruct
#                   base_url: https://integrate.api.nvidia.com/v1   api_key: ${NVIDIA_API_KEY}
#   OpenRouter:     provider: openai  model: <org/model>
#                   base_url: https://openrouter.ai/api/v1          api_key: ${OPENROUTER_API_KEY}
#   Local vLLM:     provider: openai  model: <served>  base_url: http://localhost:8001/v1
llm:
  provider: groq
  model: llama-3.1-8b-instant
  api_key: ${GROQ_API_KEY}
  # base_url:               # set for openai-compatible endpoints
  # temperature: 0.2
  # max_tokens:             # default completion cap; enrich_chunks sizes its own per batch

# ── Vision ────────────────────────────────────────────────────────────────────
# provider: google (AI Studio) | ollama (self-hosted) | openai (any OpenAI-compatible
# multimodal endpoint via base_url — GPT-4o-vision, NVIDIA NIM VLMs, OpenRouter).
vision:
  provider: google
  model: gemma-4-31b-it     # multimodal; gemma-3-27b-it is NOT on the AI Studio API
  api_key: ${GOOGLE_API_KEY}
  # base_url:               # set for vision.provider: openai
  enabled: true
  dpi: 150                  # render resolution for PDF image regions
  min_image_px: 150         # images smaller than this (each side) are skipped
  # timeout_s must cover the retry budget: a 429 from Google's free tier asks us
  # to wait ~12s, and we retry up to max_retries times, so keep this generous.
  timeout_s: 150
  max_retries: 5            # retry 429/500/503 with backoff (honors server retry_delay)
  max_concurrency: 2        # parallel calls per doc; lower = fewer free-tier 429 bursts
  # Focus instructions, selected by route first, then industry, then "default"
  # (see backend/vision/prompts.py:build_vision_prompt). Add a customer's industry
  # key here to tune captions without code changes.
  prompt:
    default: >
      Describe what this image shows in 2–3 sentences. Be specific about
      diagrams, charts, component labels, dimensions, and any text visible.
    automotive: >
      You are analyzing a page from a vehicle/equipment service manual. Capture
      exploded views and assembly diagrams, part names and part numbers, callout
      numbers, fasteners, torque/clearance specs, and any labels, warnings, or
      measurements. Be precise — this is used for parts/maintenance search.
    cad_route: >
      Describe all visible circuit components, reference designators (R1, C4),
      net names (e.g. 5V_RAIL, GND), connector types, pin counts, and any
      visible dimensions or tolerances. Be precise — this is used for search.

# ── OCR (scanned pages) ───────────────────────────────────────────────────────
# OCR runs in an ISOLATED subprocess (scanned_pdf/ocr_worker.py) so the native OCR
# stack can't crash the backend. Pick the engine per DEPLOYMENT:
# engine: surya | paddle
#   surya  — torch + llama.cpp; ONE pass gives text + layout, 90+ languages, best
#            accuracy on complex layouts. Needs the llama-server binary
#            (brew install llama.cpp). BEST ON A GPU/LINUX BOX: on CPU/Apple Silicon
#            llama-server stalls over long docs, so prefer surya only where a GPU
#            backs llama-server. Set ocr.engine: surya in that deployment's profile.
#   paddle — PaddleOCR text + DocLayout-YOLO/contour regions. CNN recognition,
#            reliable and fast on CPU. DEFAULT for CPU/dev/Mac.
ocr:
  engine: paddle            # CPU default; switch to 'surya' on GPU deployments
  # Surya can stall on a cold/unhealthy llama-server. Each page is bounded by this
  # many seconds; on timeout (or any error) that page falls back to PaddleOCR so a
  # stall can't hang an ingestion. Warm Surya pages take ~20-25s, so keep headroom.
  surya_timeout_s: 90
  # OCR runs in an isolated subprocess (avoids native crashes in the backend). This
  # caps the whole document's OCR; if exceeded, the child is killed and the doc is
  # marked failed instead of hanging. 22 scanned pages ran in ~5 min, so allow room.
  subprocess_timeout_s: 1800

# ── Embeddings ────────────────────────────────────────────────────────────────
embeddings:
  # nomic-embed-text-v1.5 chosen over BAAI/bge-large-en-v1.5 for CPU compatibility:
  # bge-large (1.3GB) causes deadlocks on Windows and is too slow on CPU (~148s/21 chunks).
  # nomic runs well on CPU (15-100ms), 768-dim, MTEB 62.39, 8192 token context.
  dense_model: nomic-ai/nomic-embed-text-v1.5
  dense_dim: 768
  sparse_model: Qdrant/bm25             # keyword matching for hybrid search
  reranker_model: BAAI/bge-reranker-large
  # SemanticChunker uses this lightweight model to decide split boundaries only —
  # potion-base-32M (32M params) avoids loading the full dense model twice.
  chunking_model: minishlab/potion-base-32M

# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  strategy: semantic        # semantic | recursive
  size: 400                 # tokens (not characters)
  overlap: 50               # tokens

# ── Enrichment ────────────────────────────────────────────────────────────────
# enrich_chunks stamps tags + (when summarize) an LLM one-line summary + semantic
# keywords on each chunk. summarize: false -> offline frequency keywords only.
enrichment:
  summarize: true
  keyword_count: 6           # fallback frequency keywords if the LLM is off/fails
  batch_size: 10             # chunks summarized per LLM call (low call count = no rate limits)
  # Instruction describing what to produce per chunk (summary + meaningful keywords).
  # The pipeline adds the numbered chunks and asks for a JSON array — don't put a
  # chunk in here. Editable in the Settings UI.
  prompt: >
    You label document chunks for search. For each chunk, write a one-sentence
    summary of what it is about and 6-10 meaningful, specific keywords/phrases that
    capture its content (real terms a user would search — never filler/stopwords).

# ── Query pipeline ────────────────────────────────────────────────────────────
query:
  small_corpus_tokens: 100000   # below this, adaptive_router skips retrieval
  max_context_tokens: 3000      # answer_tool context budget

  # Query-time pipeline steps (the read path). run_query() builds the graph from
  # this list: plan the query -> retrieve -> answer. Same graph engine as ingestion.
  steps: [query_planner, retrieval, answerer]

  planner:
    max_sub_questions: 4        # QueryPlannerTool: cap on decomposed sub-questions

  hyde:
    enabled: false              # generate hypothetical answer before encoding

  # ── Retrieval settings (Vinod's tools read these) ─────────────────────────
  # These are accessed as config["query"]["retrieval"]["..."] in tool code.
  # Vector DB = Qdrant (see database.qdrant_url).
  # Relational DB = PostgreSQL (not MSSQL). See database.postgres_url.
  retrieval:
    method: hybrid_rerank       # naive | hybrid | hybrid_rerank | hyde | enriched
    top_n: 20                   # candidates fetched from Qdrant before reranking
    candidate_k: 80             # wider pool for reranking (typically top_n * 4)
    rerank_top_k: 5             # chunks kept after reranking
    dense_weight: 0.6           # RRF weight for dense leg (hybrid methods)
    sparse_weight: 0.4          # RRF weight for sparse/BM25 leg

  agent:
    max_iterations: 5

# ── Notes for Vinod ───────────────────────────────────────────────────────────
# config passed to your tool is the full dict from load_config("config/global.yaml").
# Read your settings with:
#   config["query"]["retrieval"]["method"]
#   config["query"]["retrieval"]["top_n"]
#   config["embeddings"]["dense_model"]     ← shared with Manoj's embed_tool
#   config["embeddings"]["sparse_model"]
#   config["embeddings"]["reranker_model"]
#   config["database"]["qdrant_url"]
#   config["database"]["postgres_url"]
# Never use os.getenv() for model names — keep them in config so they're swappable.

# ── Document taxonomy ─────────────────────────────────────────────────────────
document_types:
  - invoice
  - report
  - cad_drawing       # mechanical CAD: assembly drawings, part drawings, engineering blueprints
  - circuit_diagram   # electrical: schematics, PCB layouts, wiring diagrams
  - datasheet
  - presentation
  - spreadsheet
  - image
  - unknown

industries:
  - automotive
  - electronics
  - manufacturing
  - finance
  - legal
  - healthcare
  - general

default_industry: general

# ── Categorization ────────────────────────────────────────────────────────────
# Used by CategorizeTool (owner: Abhishek).
# config["categorization"]["industry_keywords"] — keyword lists per industry
# config["categorization"]["confidence_thresholds"] — when to flag low confidence
categorization:
  confidence_thresholds:
    categorization_low_confidence: 0.5

  industry_keywords:
    automotive:   [toyota, ford, bmw, vehicle, engine, torque, transmission, chassis, automotive]
    electronics:  [circuit, pcb, schematic, voltage, resistor, capacitor, signal, semiconductor]
    manufacturing: [assembly, drawing, tolerance, weld, machining, fixture, jig, bom, part number]
    finance:      [invoice, balance sheet, revenue, profit, ledger, audit, fiscal, equity]
    legal:        [contract, agreement, clause, liability, indemnity, arbitration, jurisdiction]
    healthcare:   [patient, diagnosis, clinical, pharma, dosage, trial, medical, drug, therapy]
    general:      []

# ── Routing ───────────────────────────────────────────────────────────────────
# Maps document_type → route name. The route selects which pipeline steps run.
# cad_drawing and circuit_diagram are separate routes — same steps but different
# vision prompts and retrieval strategy (owner: Vinod). Karthii wires both in the graph.
type_to_route:
  cad_drawing:     cad_route      # mechanical drawings → CADExtractionTool with mechanical prompt
  circuit_diagram: circuit_route  # electrical diagrams → CADExtractionTool with electrical prompt
  datasheet:       diagram_heavy
  report:          text_default
  invoice:         text_default
  presentation:    text_default
  spreadsheet:     text_default
  image:           image_route
  unknown:         text_default

# "extract" is a placeholder in the steps below. At build time the graph expands
# it into concrete extractors; at runtime exactly one runs. Values MUST match a
# tool's `name` (see backend/extraction/*/tool.py). Selection priority:
#   route_extractors > pdf_extractors (by state.pdf_kind) > extractors (by file_type)
#
# extractors: simple file_type -> tool (1:1). `image` has no extractor yet.
extractors:
  excel: excel_extraction
  ppt: ppt_extraction

# pdf_extractors: a PDF is not one tool. The categorize step runs detector.py and
# sets state["pdf_kind"] (digital/scanned/mixed); the matching extractor runs.
pdf_extractors:
  digital: pdf_digital
  scanned: scanned_pdf
  mixed: mixed_pdf

# route_extractors: a route overrides extraction entirely. CAD/circuit drawings
# are PDFs but need vision extraction (cad_extract) with the right diagram prompt,
# not the normal text pdf extractor. On these routes the file_type/pdf extractors
# are suppressed.
route_extractors:
  cad_route: cad_extract
  circuit_route: cad_extract

routes:
  text_default:
    steps: [categorize, extract, chunk, enrich_chunks, embed, index]
  diagram_heavy:
    steps: [categorize, extract, vision_enrichment, chunk, enrich_chunks, embed, index]
  cad_route:
    # Mechanical CAD drawings — Vinod's CADExtractionTool uses a mechanical diagram prompt
    steps: [categorize, extract, chunk, enrich_chunks, embed, index]
  circuit_route:
    # Electrical circuit diagrams — Vinod's CADExtractionTool uses an electrical/schematic prompt
    steps: [categorize, extract, chunk, enrich_chunks, embed, index]
  image_route:
    steps: [categorize, extract, vision_enrichment, chunk, enrich_chunks, embed, index]

# ── Ingestion profile (what the API/run_pipeline actually builds) ─────────────
# categorize decides the route at RUNTIME, so the graph is built once with the
# UNION of steps and route_gates skip the steps a given route doesn't want.
# Only vision_enrichment varies across the routes above, so it's the only gate.
ingestion:
  steps: [categorize, extract, vision_enrichment, chunk, enrich_chunks, embed, index]
  route_gates:
    # vision_enrichment must run on text_default too: most real documents
    # (manuals, reports, datasheets with diagrams) land there, and their images
    # would otherwise never be captioned. CAD/circuit routes are intentionally
    # excluded — their route_extractor (cad_extract) does its own vision pass.
    # The tool no-ops when a page has no significant images, so this is cheap.
    vision_enrichment: [text_default, diagram_heavy, image_route]

# ── Database (connection strings from environment) ────────────────────────────
database:
  postgres_url: ${POSTGRES_URL}
  qdrant_url: ${QDRANT_URL}
  qdrant_collection: chunks
