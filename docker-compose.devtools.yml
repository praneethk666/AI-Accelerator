# DB viewer — browse Postgres tables/rows at http://localhost:8080
#   System: PostgreSQL · Server: postgres · User/Pass: postgres · DB: accelerator
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.devtools.yml up -d
services:
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
