# Core data plane — required to run the pipeline at all.
#   docker compose up -d
#
# Optional add-ons live in their own files (bring up only what you need):
#   docker-compose.devtools.yml       — Adminer (Postgres browser)
#   docker-compose.observability.yml  — Langfuse (LLM tracing) + Grafana (metrics)
# Combine with -f, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.devtools.yml up -d
services:

  # ── Vector database (Qdrant) ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Relational database (PostgreSQL) ─────────────────────────────────────
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accelerator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  postgres_data:
