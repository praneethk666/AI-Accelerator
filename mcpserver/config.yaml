server:
  host: "0.0.0.0"
  port: 8100
  allowed_origins:
    - "http://localhost:8100"
    - "http://127.0.0.1:8100"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "https://modelcontextprotocol.io"
    - "*"  # Or specify trusted origins for production

auth:
  enabled: true
  jwt:
    enabled: true
    secret_key: "${env:JWT_SECRET}"
    issuer: "local-mcp-issuer"
    audience: "local-mcp-audience"
    algorithms:
      - "HS256"
  tokens:
    "agent_alpha": "agent_alpha"
    "agent_beta": "agent_beta"
    "admin": "admin"
    "vishal": "vishal"
    "vinod": "vinod"
  users:
    vishal:
      password: "vishal123"
      identity: "vishal"
      token: "${env:VISHAL_TEST_TOKEN}"
    vinod:
      password: "vinod123"
      identity: "vinod"
      token: "${env:VINOD_TEST_TOKEN}"
    admin:
      password: "admin123"
      identity: "admin"
      token: "${env:ADMIN_TOKEN_SECRET}"
    agent_alpha:
      password: "alpha123"
      identity: "agent_alpha"
      token: "${env:AGENT_TOKEN_ALPHA}"
    agent_beta:
      password: "beta123"
      identity: "agent_beta"
      token: "${env:AGENT_TOKEN_BETA}"
  permissions:
    vishal: ["*"]
    vinod: ["*"]
    admin: ["*"]
    agent_alpha: ["get_current_datetime", "send_email"]
    agent_beta: ["get_current_datetime"]  # Read-only agent (no email dispatch access)

security:
  email:
    allowlist:
      - "ops@company.com"
      - "manager@company.com"
      - "alerts@company.com"
      - "vishal@company.com"
      - "vinod@company.com"
      - "vishalreddykonreddy@gmail.com"
      - "bonthumanoj999@gmail.com"
      - "vnerella88@gmail.com"
      - "*@trusteddomain.com"
    rate_limit:
      max_calls: 10
      window_seconds: 60
    prompt_injection_guard:
      enabled: true
      strict_mode: true

smtp:
  mode: "smtp"
  host: "smtp.gmail.com"
  port: 587
  username: "${env:SMTP_USER}"
  password: "${env:SMTP_PASS}"
  use_tls: true
  sender_address: "${env:SMTP_USER}"

credentials:
  provider: "${env:CREDENTIAL_PROVIDER}"
  openbao:
    path_mapping:
      smtp: "mcp/smtp"
