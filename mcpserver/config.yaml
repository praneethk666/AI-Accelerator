server:
  host: "0.0.0.0"
  port: 8100
  allowed_origins:
    - "http://localhost:8100"
    - "http://127.0.0.1:8100"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "https://modelcontextprotocol.io"
    - "*"  # Or specify trusted origins for production

auth:
  enabled: true
  tokens:
    "${env:AGENT_TOKEN_ALPHA}": "agent_alpha"
    "${env:AGENT_TOKEN_BETA}": "agent_beta"
    "${env:ADMIN_TOKEN_SECRET}": "admin_user"
    "${env:VISHAL_TEST_TOKEN}": "vishal_engineer"
    "${env:VINOD_TEST_TOKEN}": "vinod_engineer"
  users:
    vishal:
      password: "vishal123"
      identity: "vishal_engineer"
      token: "vishal-test-token"
    vinod:
      password: "vinod123"
      identity: "vinod_engineer"
      token: "vinod-test-token"
    admin:
      password: "admin123"
      identity: "admin_user"
      token: "admin-token-secret"
    agent_alpha:
      password: "alpha123"
      identity: "agent_alpha"
      token: "agent-token-alpha"
    agent_beta:
      password: "beta123"
      identity: "agent_beta"
      token: "agent-token-beta"
  permissions:
    vishal_engineer: ["*"]
    vinod_engineer: ["*"]
    admin_user: ["*"]
    agent_alpha: ["get_current_datetime", "send_email"]
    agent_beta: ["get_current_datetime"]  # Read-only agent (no email dispatch access)

security:
  email:
    allowlist:
      - "ops@company.com"
      - "manager@company.com"
      - "alerts@company.com"
      - "vishal@company.com"
      - "vinod@company.com"
      - "vishalreddykonreddy@gmail.com"
      - "bonthumanoj999@gmail.com"
      - "vnerella88@gmail.com"
      - "*@trusteddomain.com"
    rate_limit:
      max_calls: 10
      window_seconds: 60
    prompt_injection_guard:
      enabled: true
      strict_mode: true

smtp:
  mode: "smtp"
  host: "smtp.gmail.com"
  port: 587
  username: "${env:SMTP_USER}"
  password: "${env:SMTP_PASS}"
  use_tls: true
  sender_address: "${env:SMTP_USER}"
