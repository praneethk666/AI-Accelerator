[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamable-mcp-server"
version = "0.2.0"
description = "Streamable HTTP + SSE MCP Server with Session Auth, Injection Guardrails, and Allowlisting"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.30.0",
    "pydantic[email]>=2.0.0",
    "PyYAML>=6.0",
    "pytz>=2024.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-server = "src.server:main"
